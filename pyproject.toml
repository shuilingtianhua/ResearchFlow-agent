[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researchflow-agent"
version = "0.0.0"
description = "A Python multi-agent research execution system."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anyio>=4,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.10,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13,<2",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.8,<1",
]
persistence = [
    "aiosqlite>=0.20,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
]

[project.scripts]
researchflow = "researchflow.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["researchflow"]
